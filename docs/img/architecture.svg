<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<g fill="none" stroke="#57606a" stroke-width="1.3">
<!-- host -->
<rect x="16" y="150" width="112" height="150" rx="6" fill="#f6f8fa"/>
<!-- port + registers -->
<rect x="176" y="150" width="130" height="150" rx="6" fill="#ddf4ff" stroke="#0969da"/>
<!-- program memory -->
<rect x="360" y="24" width="300" height="52" rx="6" fill="#fff8c5" stroke="#9a6700"/>
<!-- threads -->
<rect x="360" y="108" width="300" height="140" rx="6" fill="#dafbe1" stroke="#1a7f37"/>
<rect x="360" y="282" width="300" height="140" rx="6" fill="#dafbe1" stroke="#1a7f37"/>
<!-- pins -->
<rect x="716" y="108" width="148" height="314" rx="6" fill="#fbefff" stroke="#8250df"/>
<!-- fifos -->
<rect x="376" y="196" width="118" height="38" rx="4" fill="#ffffff"/>
<rect x="526" y="196" width="118" height="38" rx="4" fill="#ffffff"/>
<rect x="376" y="296" width="118" height="38" rx="4" fill="#ffffff"/>
<rect x="526" y="296" width="118" height="38" rx="4" fill="#ffffff"/>
<!-- arrows -->
<path d="M128 225H174" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M306 170H334V50H358" marker-end="url(#a)"/>
<path d="M306 215H374" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M306 262H334V315H374" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M440 76V106" marker-end="url(#a)"/>
<path d="M600 76V92H684V266H600V280" marker-end="url(#a)"/>
<path d="M660 160H714" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M660 380H714" marker-end="url(#a)" marker-start="url(#a)"/>
<path d="M585 234V265H435V294" stroke="#cf222e" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M864 150H876M864 185H876M864 220H876M864 255H876M864 290H876M864 325H876M864 360H876M864 395H876"/>
</g>
<g fill="#1b1f24">
<text x="72" y="206" text-anchor="middle" font-weight="600">Host</text>
<text x="72" y="226" text-anchor="middle" font-size="12">RP2350 on the</text>
<text x="72" y="242" text-anchor="middle" font-size="12">demo board,</text>
<text x="72" y="258" text-anchor="middle" font-size="12">or any SPI host</text>
<text x="151" y="218" text-anchor="middle" font-size="11" fill="#57606a">SPI</text>
<text x="241" y="178" text-anchor="middle" font-weight="600">SPI port</text>
<text x="241" y="198" text-anchor="middle" font-size="12">24-bit transfers</text>
<text x="241" y="226" text-anchor="middle" font-weight="600">Registers</text>
<text x="241" y="246" text-anchor="middle" font-size="12">per-thread config,</text>
<text x="241" y="262" text-anchor="middle" font-size="12">pin modes, CTRL,</text>
<text x="241" y="278" text-anchor="middle" font-size="12">FIFO access</text>
<text x="510" y="46" text-anchor="middle" font-weight="600">Program memory: 64 words of 16 bits</text>
<text x="510" y="64" text-anchor="middle" font-size="12">shared; one read port per thread</text>
<text x="376" y="130" font-weight="600">Thread 0</text>
<text x="376" y="150" font-size="12">PC, X, Y, OSR, ISR, delay and timeout counters,</text>
<text x="376" y="166" font-size="12">clock divider. One instruction per clock.</text>
<text x="435" y="220" text-anchor="middle" font-size="12">TX FIFO, 4 deep</text>
<text x="585" y="220" text-anchor="middle" font-size="12">RX FIFO, 4 deep</text>
<text x="376" y="364" font-weight="600">Thread 1</text>
<text x="376" y="384" font-size="12">the same again; when both write a pin in one</text>
<text x="376" y="400" font-size="12">clock, thread 1 wins</text>
<text x="435" y="320" text-anchor="middle" font-size="12">TX FIFO, 4 deep</text>
<text x="585" y="320" text-anchor="middle" font-size="12">RX FIFO, 4 deep</text>
<text x="492" y="260" font-size="11" fill="#cf222e">CHAIN (optional)</text>
<text x="790" y="132" text-anchor="middle" font-weight="600">8 protocol pins</text>
<text x="790" y="158" text-anchor="middle" font-size="12">each input,</text>
<text x="790" y="174" text-anchor="middle" font-size="12">push-pull or</text>
<text x="790" y="190" text-anchor="middle" font-size="12">open-drain</text>
<text x="790" y="226" text-anchor="middle" font-size="12">one shared</text>
<text x="790" y="242" text-anchor="middle" font-size="12">output register</text>
<text x="790" y="278" text-anchor="middle" font-size="12">two-flop input</text>
<text x="790" y="294" text-anchor="middle" font-size="12">synchroniser,</text>
<text x="790" y="310" text-anchor="middle" font-size="12">bypass per pin</text>
<text x="790" y="346" text-anchor="middle" font-size="12">a thread reads</text>
<text x="790" y="362" text-anchor="middle" font-size="12">the other's output</text>
<text x="790" y="378" text-anchor="middle" font-size="12">with no delay</text>
<text x="16" y="452" font-size="12" fill="#57606a">A protocol is a program in the memory. Nothing in the hardware is specific to any protocol.</text>
</g>
</svg>
