# Tiny Tapeout project information
project:
  title:        "Protocol Emulator"      # Project title
  author:       "Tave La Rocque"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Programmable bit-banging core (PIO-style) for UART, SPI, I2C; firmware loaded over SPI"      # One line description of what your project does
  language:     "Hardcaml (OCaml)" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 202x155 uM.
  # The Jane Street protocol emulator competition allows up to 8x4; the design
  # uses 28% of 6x4, so it stays at 6x4.
  tiles: "6x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2, 8x2, 3x4, 4x4, 5x4, 6x4 or 8x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_tavelarocque_protocol_emulator"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  # protocol_emulator.v is generated from hw/top.ml by `dune build`; do not edit it by hand.
  source_files:
    - "project.v"
    - "protocol_emulator.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "SCK"
  ui[1]: "CS_N"
  ui[2]: "MOSI"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "MISO"
  uo[1]: "T0_RUNNING"
  uo[2]: "T0_RX_READY"
  uo[3]: "T0_TX_FULL"
  uo[4]: "T1_RUNNING"
  uo[5]: "T1_RX_READY"
  uo[6]: "T1_TX_FULL"
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "P0"
  uio[1]: "P1"
  uio[2]: "P2"
  uio[3]: "P3"
  uio[4]: "P4"
  uio[5]: "P5"
  uio[6]: "P6"
  uio[7]: "P7"

# Do not change!
yaml_version: 6
