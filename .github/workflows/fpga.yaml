name: fpga

# The whole chip as a bitstream for a Sipeed Tang Nano 20K (fpga/README.md),
# after proving the FPGA's memories equal IHP's model of the SRAM macros.
on:
  push:
    paths:
      - "src/**"
      - "fpga/**"
      - "test/sram_model/**"
      - ".github/workflows/fpga.yaml"
  workflow_dispatch:

jobs:
  tangnano20k:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install the OSS CAD Suite (release 2026-11-01)
        run: |
          curl -sSfL -o oss.tgz \
            https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-11-01/oss-cad-suite-linux-x64-20261101.tgz
          tar xzf oss.tgz
          echo "$PWD/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: The FPGA memories equal IHP's model of the SRAM macros (fpga/sram_check.py)
        run: |
          set -o pipefail
          python3 fpga/sram_check.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Bitstream, clocked by the Pico
        run: |
          set -o pipefail
          yosys -V
          fpga/build.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Bitstream, clocked by the board's 27 MHz crystal
        run: |
          set -o pipefail
          fpga/build.sh clk27 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the bitstreams and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tangnano20k
          path: |
            fpga/build/*.fs
            fpga/build/*.log
