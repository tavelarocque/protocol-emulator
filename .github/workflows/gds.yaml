name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttihp27a
        with:
          pdk: ihp-sg13cmos5l

      - name: Print the layout's check reports into the log
        # The flow only says that maximum slew and capacitance warnings
        # exist; which nets, by how much, and the worst timing paths are in
        # report files inside a 156 MB artifact. Printed here they can be
        # read, and compared from one layout to the next.
        if: always()
        continue-on-error: true
        run: |
          runs=$(find . -maxdepth 4 -type d -path '*runs/wokwi' | head -n 1)
          if [ -z "$runs" ]; then echo "no runs/wokwi directory here:"; ls; exit 0; fi
          section() { echo "::group::$1"; }
          for f in $(find "$runs" -path '*stapostpnr*' -name checks.rpt | sort); do
            section "$f"; cat "$f"; echo "::endgroup::"
          done
          for f in $(find "$runs" -path '*stapostpnr*' \( -name ws.max.rpt -o -name ws.min.rpt \) | sort); do
            echo "== $f"; cat "$f"
          done
          for f in $(find "$runs" -path '*stapostpnr*' -name max.rpt | sort); do
            section "$f: the worst setup path"; sed -n 1,140p "$f"; echo "::endgroup::"
          done
          for f in $(find "$runs" -path '*repairdesign*' -name '*.log' | sort); do
            section "$f"; tail -n 80 "$f"; echo "::endgroup::"
          done
          section "Magic's illegal overlaps, by kind, then the first twenty"
          find "$runs" -path '*magic-spiceextraction*' -type f -exec grep -ih "illegal overlap" {} + > "$RUNNER_TEMP/overlaps.txt" || true
          sed -E 's/(^|[^A-Za-z0-9_])-?[0-9]+(\.[0-9]+)?/\1N/g' "$RUNNER_TEMP/overlaps.txt" | sort | uniq -c | sort -rn | head -n 40
          head -n 20 "$RUNNER_TEMP/overlaps.txt"
          echo "::endgroup::"

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp27a

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: sigrok, so its decoders judge the gate netlist's pins too (test/sigrok.py)
        run: sudo apt-get update && sudo apt-get install -y sigrok-cli
        continue-on-error: true  # without it those checks are skipped, as locally

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp27a

  gl_equiv:
    # Formal equivalence of this build's gate netlist and the RTL
    # (gl_equiv/check.py), plus five netlist bugs that must each break it.
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: Download the gate netlist
        uses: actions/download-artifact@v7
        with:
          name: tt_submission
          path: gl

      - name: Cell library from the PDK revision the layout used
        run: |
          rev=$(jq -r .PDK_VERSION gl/tt_submission/pdk.json)
          lib=ihp-sg13cmos5l/libs.ref/sg13cmos5l_stdcell/lib
          git init -q pdk && cd pdk
          git remote add origin https://github.com/IHP-GmbH/IHP-Open-PDK.git
          git sparse-checkout set --no-cone "$lib/sg13cmos5l_stdcell_typ_1p20V_25C.lib"
          git fetch -q --depth 1 --filter=blob:none origin "$rev"
          git checkout -q FETCH_HEAD
          echo "LIB=$PWD/$lib/sg13cmos5l_stdcell_typ_1p20V_25C.lib" >> "$GITHUB_ENV"

      - name: Install Yosys
        run: pip install yowasp-yosys==0.70.0.0.post1259

      - name: Prove the netlist equal to the RTL
        # pipefail: without it the step takes tee's exit status, and a
        # crash in check.py is reported as success.
        run: |
          set -o pipefail
          python3 gl_equiv/check.py --mutants --yosys yowasp-yosys \
            --lib "$LIB" --netlist gl/tt_submission/tt_um_tavelarocque_protocol_emulator.v \
            | tee -a "$GITHUB_STEP_SUMMARY"

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttihp27a
