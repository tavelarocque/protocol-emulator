name: ocaml
on: [push, workflow_dispatch]
jobs:
  ocaml:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Z3 (SAT solver for the formal proof)
        run: sudo apt-get update && sudo apt-get install -y z3
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"
      - name: js_of_ocaml 6.2.0, pinned, for the playground (playground/, docs/playground.html)
        run: |
          opam pin add -n -y js_of_ocaml-compiler 6.2.0
          opam pin add -n -y js_of_ocaml 6.2.0
      - run: opam install -y hardcaml hardcaml_waveterm hardcaml_verify ppx_hardcaml ppx_jane core dune js_of_ocaml-compiler js_of_ocaml
      - uses: actions/setup-node@v4  # dune runtest runs playground/exact.js with node
        with:
          node-version: "22"
      - run: opam exec -- dune build
      - run: opam exec -- dune runtest
      - name: Every example program assembles (examples/*.s)
        run: |
          for f in examples/*.s; do _build/default/bin/pe_sim.exe asm $f > /dev/null || exit 1; done
      - name: Timing diagrams match the reference model (docs/img)
        run: python3 docs/figures.py --check
      - name: Blind-written WS2812 firmware passes its hidden test (examples/ws2812)
        run: |
          for seed in 1 2 3; do
            PE_SIM=_build/default/bin/pe_sim.exe python3 examples/ws2812/accept.py examples/ws2812 $seed
          done
      - name: The program memory the proofs use equals IHP's model of the SRAM macro (formal/sram_equiv.py)
        run: |
          pip install yowasp-yosys==0.70.0.0.post1259
          python3 formal/sram_equiv.py
      - name: Generated Verilog, firmware images, example programs and the playground page match the committed copies
        run: git diff --exit-code src/ test/ examples/ docs/playground.html
